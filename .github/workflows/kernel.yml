# Build the custom GKI kernel (KernelSU-Next + SUSFS + anti-emulator patches)
# and publish the images.
#
# Both builds are cross-compiles driven by scripts/build-all.sh --arch <a>, so
# they run on the same ubuntu-latest runner and in the same container image.
#
# The matrix is chosen per push by scripts/select-arches.sh rather than fixed at
# both: a change confined to one arch's config or patches only builds that arch.
# Narrowing needs positive evidence and everything else builds both -- see that
# script for why it errs that way.
#
# The GCS publish step is inert until Workload Identity Federation is
# configured: it is skipped unless the GCP_WORKLOAD_IDENTITY_PROVIDER repo
# variable is set. The artifact upload always runs, so the kernel is
# retrievable from the run either way.

name: kernel

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Which arch to build (a push decides this for itself)
        type: choice
        default: both
        options: [both, arm64, x86_64]
  push:
    paths:
      - 'kernel-build/**'
      - '.github/workflows/kernel.yml'
      - '.github/scripts/select-arches.sh'
      # A kernel build is 30-60 min of runner time. Editing kernel-build/README.md
      # used to buy one, because it sits under kernel-build/**. Exclusion patterns
      # are evaluated in order and the last match for a file wins, so this must
      # stay below every include above. A commit touching a doc AND a script still
      # builds: the workflow runs if ANY changed file ends up included.
      - '!**.md'

# A kernel build is ~30-60 min; don't stack them up on a busy branch.
concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write        # required for Workload Identity Federation

jobs:
  # One short job that picks the matrix. It replaces a per-arch gate step, which
  # still had to start a runner and check out the tree before it could decide to
  # do nothing -- a whole billed job to skip a build.
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      arches: ${{ steps.pick.outputs.arches }}
    steps:
      # Full history: a push can span several commits, so the diff needs the
      # commit github.event.before points at, which a shallow clone will not have.
      # The repo is under 1 MB, so this costs nothing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: pick
        env:
          WANT: ${{ github.event.inputs.arch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          out=$(./.github/scripts/select-arches.sh)
          echo "$out" >> "$GITHUB_OUTPUT"
          arches=$(sed -n 's/^arches=//p' <<< "$out")
          why=$(sed -n 's/^why=//p' <<< "$out")
          echo "::notice::building ${arches} — ${why}"
          {
            echo "### Building \`${arches}\`"
            echo "${why}"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.select.outputs.arches) }}
    steps:
      - uses: actions/checkout@v4

      # The AOSP common-kernel clone is ~3 GB and the build tree is ~10 GB more.
      # A stock ubuntu-latest runner does not have room for both without this.
      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: kernel-build/.ccache
          key: ccache-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.arch }}-

      - name: Build container image
        working-directory: kernel-build
        run: docker build -t kbuild .

      # The kbuild-sources named volume mirrors the documented local
      # invocation (on macOS it is required -- the kernel tree has paths that
      # collide on a case-insensitive filesystem). Keeping CI identical means a
      # CI failure reproduces locally with the same command.
      - name: Build kernel (${{ matrix.arch }})
        working-directory: kernel-build
        run: |
          docker volume create kbuild-sources
          docker run --rm \
            -v "$PWD":/work \
            -v kbuild-sources:/work/sources \
            -w /work kbuild \
            ./scripts/build-all.sh --arch ${{ matrix.arch }}

      - name: Identify output
        id: out
        working-directory: kernel-build
        run: |
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            img=Image.gz
          else
            img=bzImage
          fi
          test -s "out/$img" || { echo "::error::out/$img missing or empty"; ls -la out/ || true; exit 1; }

          # Publish under the name the consumer already expects. avd-cloud-portable's
          # stacks/ksu.sh looks for payloads/kernel/<img>-android15-6.6-ksu-susfs, and
          # payloads/manifest.tsv tracks that name -- publishing bare Image.gz/bzImage
          # lands two files the manifest does not know about, which `payloads.sh verify`
          # then reports as untracked. The suffix also records WHICH kernel this is,
          # which matters once there is more than one.
          pub="$img-android15-6.6-ksu-susfs"

          # Stage the rename OUTSIDE out/. The container writes out/ as root
          # through the bind mount, so the directory is root-owned on the host
          # and the runner user cannot create files in it -- `cp` into out/
          # fails with EACCES. Reading from out/ is fine, which is why this only
          # showed up once the workflow started writing there.
          stage="$RUNNER_TEMP/dist"
          mkdir -p "$stage"
          cp -f "out/$img" "$stage/$pub"

          echo "img=$img"        >> "$GITHUB_OUTPUT"
          echo "pub=$pub"        >> "$GITHUB_OUTPUT"
          echo "path=$stage/$pub" >> "$GITHUB_OUTPUT"
          {
            echo "### ${{ matrix.arch }} — \`$pub\` ($(du -h "out/$img" | cut -f1))"
            echo '```'
            strings "out/$img" | grep -m1 "Linux version" || echo "(banner is inside the compressed payload)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.arch }}
          path: ${{ steps.out.outputs.path }}
          if-no-files-found: error

      # ---- Publish to GCS -------------------------------------------------
      # Skipped entirely until WIF is configured. Keyless: no service-account
      # JSON in the repo. See docs/CI.md.
      - name: Authenticate to Google Cloud
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # Publishes to a BUILD ARTIFACT prefix, deliberately not into
      # payloads/kernel/. payloads/ is a pinned store: payloads/manifest.tsv
      # records a sha256 per blob and `payloads.sh verify` enforces it. CI
      # writing there overwrote the pinned kernel with a different build, so a
      # `payloads.sh fetch` would have replaced a known-good kernel with an
      # unvalidated one and then failed its own checksum test.
      #
      # Promotion into the payload store stays a deliberate act:
      #   gcloud storage cp gs://<bucket>/kernels/<arch>/<file> payloads/kernel/
      #   ./scripts/payloads.sh manifest && ./scripts/payloads.sh push
      #
      # gzip: false because the action gzip-encodes by default. On an
      # already-compressed kernel that buys nothing and sets Content-Encoding,
      # so the object's stored size no longer matches its content length --
      # which is exactly what a size-comparing rsync and a byte-count manifest
      # both rely on.
      - name: Publish kernel to GCS
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: ${{ steps.out.outputs.path }}
          destination: ${{ vars.GCS_BUCKET }}/kernels/${{ matrix.arch }}
          gzip: false

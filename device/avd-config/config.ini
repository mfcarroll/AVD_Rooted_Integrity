# Host-side AVD template. @AVD@ and @SDK@ are substituted by
# scripts/new-avd.sh. Three things here are load-bearing:
#   PlayStore.enabled=true   — avdmanager defaults this to NO even on a
#                              playstore system image, and without it Play
#                              Integrity cannot work at all.
#   fastboot.forceColdBoot   — a warm/snapshot boot skips the boot scripts and
#                              TEESimulator never lands in GENERATE mode.
#   hw.sensors.* / hw.gps    — a phone with no proximity or magnetic sensor is
#                              itself an emulator signal.
AvdId = @AVD@
PlayStore.enabled = true
abi.type = arm64-v8a
avd.ini.displayname = @AVD@
avd.ini.encoding = UTF-8
disk.dataPartition.size = 10G
fastboot.chosenSnapshotFile = 
fastboot.forceChosenSnapshotBoot = no
fastboot.forceColdBoot = yes
fastboot.forceFastBoot = no
hw.accelerometer = yes
hw.arc = false
hw.audioInput = yes
hw.battery = yes
hw.camera.back = virtualscene
hw.camera.front = emulated
hw.cpu.arch = arm64
hw.cpu.ncore = 4
hw.dPad = no
hw.device.hash2 = MD5:ee8be881199234b0fdfcba2f33290f5e
hw.device.manufacturer = Google
hw.device.name = pixel_9_pro_xl
hw.gps = yes
hw.gpu.enabled = yes
hw.gpu.mode = auto
hw.gyroscope = yes
hw.initialOrientation = portrait
hw.keyboard = yes
hw.lcd.density = 480
hw.lcd.height = 2992
hw.lcd.width = 1344
hw.mainKeys = no
hw.ramSize = 2048
hw.sdCard = yes
hw.sensors.light = yes
hw.sensors.magnetic_field = yes
hw.sensors.orientation = yes
hw.sensors.pressure = yes
hw.sensors.proximity = yes
hw.trackBall = no
hw.wifi.enabled = yes
image.sysdir.1 = system-images/android-36/google_apis_playstore/arm64-v8a/
runtime.network.latency = none
runtime.network.speed = full
sdcard.size = 512M
showDeviceFrame = yes
skin.dynamic = yes
skin.name = pixel_9_pro_xl
skin.path = @SDK@/skins/pixel_9_pro_xl
tag.display = Google Play
tag.displaynames = Google Play
tag.id = google_apis_playstore
tag.ids = google_apis_playstore
target = android-36
vm.heapSize = 256
